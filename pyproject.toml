[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeus-ticket-ops"
version = "2.0.3"
description = "Read-only ticket dashboard with safe Excel, Advanced Search, and Outlook synchronization"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Franco" }]
dependencies = [
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
outlook = ["pywin32>=306; platform_system == 'Windows'"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
zeus = "zeus2.cli:main"

[tool.setuptools]
packages = ["zeus2"]
