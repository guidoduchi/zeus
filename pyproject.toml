[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeus-ticket-ops"
version = "3.0.0"
description = "Strictly local web workstation for safe Excel, Advanced Search, and optional Outlook ticket operations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Franco" }]
dependencies = [
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
outlook = ["pywin32>=306; platform_system == 'Windows'"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
zeus = "zeus2.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zeus2*"]

[tool.setuptools.package-data]
"zeus2.web" = ["static/index.html", "static/assets/*"]
