name: Windows compatibility

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install locked web dependencies
        run: npm ci --prefix frontend
      - name: Test React behavior
        run: npm run test --prefix frontend
      - name: Build the embedded web interface
        run: npm run build --prefix frontend
      - name: Verify committed web bundle is current
        run: git diff --exit-code -- zeus2/web/static
      - name: Install Zeus with Outlook support
        run: python -m pip install -e ".[outlook]"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Verify installed version
        run: python -m zeus2 --version
      - name: Run Chrome and Microsoft Edge interaction tests
        if: matrix.python-version == '3.13'
        run: npm run test:e2e --prefix frontend
      - name: Build wheel and verify embedded assets
        shell: pwsh
        run: |
          python -m pip install build
          python -m build --wheel
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          Push-Location $env:RUNNER_TEMP
          python -c "from importlib.resources import files; assert files('zeus2.web').joinpath('static/index.html').is_file()"
          Pop-Location
